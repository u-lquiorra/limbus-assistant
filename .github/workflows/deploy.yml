name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # 公開中の前回の状態と比べ、IndexNow に送る URL を決める(今回の状態は dist/ に入れて一緒に公開する)
      - run: npx tsx scripts/indexnow.ts prepare "$RUNNER_TEMP/indexnow-urls.json"
      - uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: ${{ runner.temp }}/indexnow-urls.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 公開の後に、変わったページを IndexNow(Bing など)へ知らせる。失敗しても公開には影響しない
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: indexnow-urls
          path: ${{ runner.temp }}
      - run: npx tsx scripts/indexnow.ts submit "$RUNNER_TEMP/indexnow-urls.json"
